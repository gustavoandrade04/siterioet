<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evento | Rio Entretenimento</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <div class="logo-area">
      <a href="index.html">
        <img src="images/logo.PNG" alt="Rio Entretenimento">
      </a>
      <div class="brand">
        <h2>RIO ENTRETENIMENTO</h2>
        <p>Descontos para as melhores festas do Brasil</p>
      </div>
    </div>

    <nav>
      <ul>
        <li><a href="pages/eventos.html">Eventos</a></li>
        <li><a href="pages/openbar.html">Open Bar</a></li>

        <li class="dropdown">
          <a href="pages/reveillon.html">Réveillon ▾</a>
          <ul class="submenu">
            <li><a href="pages/rio-de-janeiro.html">Rio de Janeiro</a></li>
            <li><a href="pages/buzios.html">Búzios</a></li>
            <li><a href="pages/nordeste.html">Nordeste</a></li>
          </ul>
        </li>

        <li><a href="pages/carnaval.html">Carnaval</a></li>
        <li><a href="pages/whatsapp.html">Grupo no WhatsApp</a></li>
        <li><a href="pages/contato.html">Contato</a></li>
      </ul>
    </nav>

    <div class="search">
      <input type="text" placeholder="Buscar festa ou código">
    </div>
  </header>

  <div class="evento-container" id="evento-container">
    <p style="color:#aaa; padding:40px">Carregando evento...</p>
  </div>

  <footer>
    <p>© Rio Entretenimento</p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    fetch('dados/eventos.json')
      .then(r => r.json())
      .then(eventos => {
        const e = eventos.find(ev => ev.id === id);

        if (!e) {
          document.getElementById('evento-container').innerHTML =
            '<p style="color:#aaa;padding:40px">Evento não encontrado.</p>';
          return;
        }

        document.title = `${e.nome} | Rio Entretenimento`;

        const imagem = e.imagem
          ? `<img src="${e.imagem}" alt="${e.nome}" class="evento-banner">`
          : '';

        const oQueVaiRolar = e.o_que_vai_rolar.length
          ? `<h3>✨ O que vai rolar</h3><ul>${e.o_que_vai_rolar.map(i => `<li>${i}</li>`).join('')}</ul>`
          : '';

        const lineup = e.lineup.length
          ? `<h3>🎵 Line Up</h3><ul>${e.lineup.map(i => `<li>${i}</li>`).join('')}</ul>`
          : '';

        const subtitulo = e.subtitulo
          ? `<h2>${e.subtitulo}</h2>`
          : '';

        const btnLista = e.link_lista
          ? `<a href="${e.link_lista}" target="_blank" class="lista">🎟️ Lista VIP</a>`
          : '';

        const btnIngresso = e.link_ingresso
          ? `<a href="${e.link_ingresso}" target="_blank" class="ingresso">🎫 Comprar Ingresso</a>`
          : '';

        document.getElementById('evento-container').innerHTML = `
          <div class="evento-info">
            ${imagem}
            <h1>${e.nome}</h1>
            ${subtitulo}
            <p class="codigo">Código: ${e.codigo}</p>
            <p>📅 ${e.data}</p>
            <p>⏰ ${e.horario}</p>
            <p>📍 ${e.local}</p>
            <br>
            <h3>Descrição</h3>
            <p>${e.descricao}</p>
            <br>
            ${oQueVaiRolar}
            <br>
            ${lineup}
          </div>
          <div class="evento-acoes">
            ${btnLista}
            ${btnIngresso}
          </div>
        `;
      })
      .catch(() => {
        document.getElementById('evento-container').innerHTML =
          '<p style="color:#aaa;padding:40px">Erro ao carregar evento.</p>';
      });
  </script>

</body>
</html>
